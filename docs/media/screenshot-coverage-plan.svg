<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
  <title id="title">Brightdesk product screenshot coverage plan</title>
  <desc id="desc">A planned capture matrix for Brightdesk Suite and the ten products across Windows, macOS and Linux. Every platform is marked planned because no verified product screenshots are currently approved in this repository.</desc>
