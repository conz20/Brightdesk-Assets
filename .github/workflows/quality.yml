name: Brightdesk Assets quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "schemas/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brightdesk-assets-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Verify governed asset records
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - name: Check out Brightdesk Assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned checkout action
      - name: Set up Node.js 24.22.2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # pinned setup-node action
        with:
          node-version: 24.22.2
          package-manager-cache: false
      - name: Verify exact Node.js version
        run: test "$(node --version)" = "v24.22.2"
      - name: Check asset validator syntax
        run: node --check scripts/validate-assets.mjs
      - name: Run asset governance regression tests
        run: npm test
      - name: Validate the approved asset manifest
        run: npm run validate
      - name: Validate the asset schema JSON
        run: node -e 'JSON.parse(require("node:fs").readFileSync("schemas/asset-manifest.schema.json", "utf8"))'
